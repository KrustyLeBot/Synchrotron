name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The release key only exists in the `release` environment, restricted to main.
    # Pull requests never get it, so they can never produce a signed APK.
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'release' || null }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version-file: rclone-bridge/go.mod
          cache-dependency-path: rclone-bridge/go.sum

      - name: Cache librclone.aar
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: app/libs/librclone.aar
          key: librclone-${{ hashFiles('rclone-bridge/go.mod', 'rclone-bridge/go.sum', 'rclone-bridge/bridge/bridge.go', 'scripts/build-librclone.sh') }}

      - name: Test the rclone bridge
        run: cd rclone-bridge && go test ./bridge/

      - name: Build librclone.aar (gomobile)
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-librclone.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SYNCHROTRON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/synchrotron.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "SYNCHROTRON_KEYSTORE=$RUNNER_TEMP/synchrotron.jks" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::SYNCHROTRON_KEYSTORE_BASE64 is missing in the 'release' environment: refusing to build an unsigned release."
              exit 1
            fi
            echo "::warning::No release key (pull request): debug-signed build, never published."
          fi

      - name: Build APK
        env:
          SYNCHROTRON_KEYSTORE_PASSWORD: ${{ secrets.SYNCHROTRON_KEYSTORE_PASSWORD }}
          SYNCHROTRON_KEY_ALIAS: synchrotron
          SYNCHROTRON_KEY_PASSWORD: ${{ secrets.SYNCHROTRON_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk synchrotron.apk

      - uses: actions/upload-artifact@v4
        with:
          name: synchrotron-build-${{ github.run_number }}
          path: synchrotron.apk

      - name: Publish rolling release `latest`
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest synchrotron.apk \
            --target "$GITHUB_SHA" \
            --title "Synchrotron build ${{ github.run_number }}" \
            --notes "Automatic build ${{ github.run_number }} of ${GITHUB_SHA::7}. rclone $(grep -o 'rclone/rclone v[0-9.]*' rclone-bridge/go.mod | cut -d' ' -f2)." \
            --latest
